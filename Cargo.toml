[package]
name = "creole-nom"
version = "1.0.9"
authors = ["chidea"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "WikiCreole markup language parser library by nom"
repository = "https://github.com/chidea/creole-nom"
readme = "README.md"
keywords = ["wiki", "markdown", "parser", "creole", "nom"]
categories = ["parser-implementations"]
exclude = [ "*.sh", "*.ps1", "*.log" ]

[features]
extended = ["link-button", "font-color", "fold", "extend"]
extend = []
icon = []
link-button = []
font-color = []
fold = []

[dependencies]
nom = "8"
log = "0"
serde = {version="1", features=["derive"]}
logos = "0.16.1"

[dev-dependencies]
env_logger = "0"
